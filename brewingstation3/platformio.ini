; BrewingStation v3 — PlatformIO configuration
; Target: ESP32-C6-WROOM-1U (ESP32-C6-DevKitC-1)
; Framework: Arduino (via arduino-esp32 v3.x)
;
; NOTE: Uses pioarduino community fork instead of official espressif32.
; The official platform's RISC-V toolchain (toolchain-riscv32-esp @ 13.2.0+20240530)
; was removed from the PlatformIO registry; pioarduino bundles it correctly.

[env:esp32c6]
platform          = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board             = esp32-c6-devkitc-1
framework         = arduino

; Serial monitor
monitor_speed     = 115200
monitor_filters   = esp32_exception_decoder

; Upload
upload_speed      = 921600

; Partition scheme: 4MB flash, 2MB app, 2MB SPIFFS
board_build.partitions    = default.csv
board_build.filesystem    = littlefs
board_build.flash_mode    = dio
board_build.f_cpu         = 160000000L

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1   ; enable USB serial via built-in CDC (no CH343 needed)
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=0          ; set to 5 for verbose ESP-IDF logs

; ── library dependencies ──────────────────────────────────────────────────────
lib_deps =
    ; MQTT
    knolleary/PubSubClient @ ^2.8

    ; JSON
    bblanchon/ArduinoJson @ ^7.0

    ; Syslog
    arcao/Syslog @ ^2.0

    ; OneWire + DS18B20 — OneWire is in lib/ (patched for ESP32-C6 GPIO struct)
    milesburton/DallasTemperature @ ^3.9

    ; SPI sensors
    adafruit/Adafruit MAX31865 library @ ^1.1
    adafruit/Adafruit BME680 Library @ ^2.0
    adafruit/Adafruit Unified Sensor @ ^1.1

    ; OLED displays
    adafruit/Adafruit SSD1306 @ ^2.5
    adafruit/Adafruit GFX Library @ ^1.11

    ; PID
    br3ttb/PID @ ^1.2

    ; PCF8574 I2C GPIO expander (for LEDs)
    robtillaart/PCF8574 @ ^0.3

    ; Timer utilities (arduino-timer.h / every() + tick())
    contrem/arduino-timer

[env:esp32c6_debug]
extends           = env:esp32c6
build_type        = debug
build_flags       =
    ${env:esp32c6.build_flags}
    -DCORE_DEBUG_LEVEL=5
    -DDEBUG_ESP_WIFI=1
