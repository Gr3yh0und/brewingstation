version: 2
updates:
  # Pinned versions + weekly Dependabot PRs: updates arrive as PRs the owner
  # merges, and every deploy stays on a known tag for rollback (2026-10-16).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
