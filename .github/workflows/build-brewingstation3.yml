name: Build brewingstation3

on:
  push:
    branches: [master]
    paths:
      - 'brewingstation3/**'
      - '.github/workflows/build-brewingstation3.yml'
  pull_request:
    paths:
      - 'brewingstation3/**'
      - '.github/workflows/build-brewingstation3.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      matrix:
        env: [esp32c6, esp32c6_debug]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Provide local config.h from example
        run: cp include/config_example.h include/config.h
        working-directory: brewingstation3

      - name: Cache PlatformIO packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-${{ matrix.env }}-${{ hashFiles('brewingstation3/platformio.ini') }}
          restore-keys: |
            pio-${{ matrix.env }}-

      - name: Build (${{ matrix.env }})
        run: pio run -e ${{ matrix.env }}
        working-directory: brewingstation3

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Run native unit tests
        run: pio test -e native
        working-directory: brewingstation3
