; Brewing Station (V1) — PlatformIO configuration
; Target: DOIT ESP32 DEVKIT V1 (breadboard build)
; Framework: Arduino
;
; This project still opens directly in the Arduino IDE: brewingstation.ino is the
; sketch entry point. `src_dir = .` below points PlatformIO at the project root
; instead of requiring a src/ subfolder, so both toolchains share the same files.
;
; NOTE: Uses the pioarduino community fork instead of the official espressif32
; platform. The official platform's toolchain installer (idf_tools.py) fails
; under MSYS/Git-Bash on Windows; pioarduino bundles the toolchain directly.
; See brewingstation3/platformio.ini for the same workaround.

[platformio]
src_dir = .

[env:esp32doit-devkit-v1]
platform          = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board             = esp32doit-devkit-v1
framework         = arduino

monitor_speed     = 115200
upload_speed      = 921600

; ── library dependencies ──────────────────────────────────────────────────────
lib_deps =
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^6.21
    arcao/Syslog @ ^2.0
    https://github.com/brunocalou/Timer.git
    paulstoffregen/OneWire @ ^2.3
    milesburton/DallasTemperature @ ^3.9
    adafruit/Adafruit MAX31865 library @ ^1.1
    adafruit/Adafruit BME280 Library @ ^2.2
    adafruit/Adafruit Unified Sensor @ ^1.1
    br3ttb/PID @ ^1.2
    adafruit/Adafruit SSD1306 @ ^2.5
    adafruit/Adafruit GFX Library @ ^1.11
